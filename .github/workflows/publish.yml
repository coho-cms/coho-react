name: Publish

# Publishes @coho-cms/react to npm at the version in package.json. Keep it in step with
# @coho-cms/delivery: publish the delivery version this one's peer range names first.
# A version cannot be published twice, so every fix is a new version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The dist-tag to publish under. Prereleases need one other than latest.
        required: true
        default: alpha

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The tag reaches the shell as a variable, never pasted into the script.
      - name: Publish
        run: npm publish --tag "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
